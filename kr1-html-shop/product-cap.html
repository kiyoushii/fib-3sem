<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP - Кепка</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <nav class="nav">
            <a class="nav__link" href="index.html">Главная</a>
            <a class="nav__link" href="catalog.html">Каталог</a>
            <a class="nav__link" href="about.html">О нас</a>
            <a class="nav__link" href="contacts.html">Контакты</a>
        </nav>
    </header>
    <main>

        <article class="product-detail-card">
            <div class="product-detail-card__gallery">
                <img class="product-detail-card__img" src="img/product2-1.jpg" alt="Кепка">
                <div class="product-detail-card__thumbs">
                    <img class="product-detail-card__thumb" src="img/product2-2.jpg" alt="Кепка, вид 2">
                    <img class="product-detail-card__thumb" src="img/product2-3.jpg" alt="Кепка, вид 3">
                    <img class="product-detail-card__thumb" src="img/product2-4.jpg" alt="Кепка, вид 4">
                    <img class="product-detail-card__thumb" src="img/product2-5.jpg" alt="Кепка, вид 5">
                </div>
            </div>
            <div class="product-detail-card__info">
                <h1 class="product-detail-card__title">Кепка</h1>
                <p class="product-detail-card__description">Качественная кепка в отличном состоянии, удобная посадка на
                    каждый день.</p>
                <p class="product-detail-card__price">Цена: 4990₽</p>
                <button class="product-detail-card__btn">В корзину</button>
            </div>
        </article>

        <section class="sizes">
            <h2 class="sizes__title">Размеры и комплектация</h2>
            <table class="sizes__table">
                <thead>
                    <tr>
                        <th scope="col">S</th>
                        <th scope="col">M</th>
                        <th scope="col">L</th>
                        <th scope="col">XL</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>В наличии</td>
                        <td>В наличии</td>
                        <td>В наличии</td>
                        <td>Нет в наличии</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy;kiyoushii Shop. Все права защищены.</p>
    </footer>

</body>
</html>
