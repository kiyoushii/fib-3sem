<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP - Ботинки</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <nav class="nav">
            <a class="nav__link" href="index.html">Главная</a>
            <a class="nav__link" href="catalog.html">Каталог</a>
            <a class="nav__link" href="about.html">О нас</a>
            <a class="nav__link" href="contacts.html">Контакты</a>
        </nav>
    </header>
    <main>

        <article class="product-detail-card">
            <img class="product-detail-card__img" src="img/boti.jpg" alt="Ботинки">
            <div class="product-detail-card__info">
                <h1 class="product-detail-card__title">Ботинки</h1>
                <p class="product-detail-card__description">Прочные ботинки из качественных материалов, подойдут на
                    каждый день и в непогоду.</p>
                <p class="product-detail-card__price">Цена: 10990₽</p>
                <button class="product-detail-card__btn">В корзину</button>
            </div>
        </article>

        <section class="sizes">
            <h2 class="sizes__title">Размеры и комплектация</h2>
            <table class="sizes__table">
                <thead>
                    <tr>
                        <th scope="col">40</th>
                        <th scope="col">41</th>
                        <th scope="col">42</th>
                        <th scope="col">43</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>В наличии</td>
                        <td>Нет в наличии</td>
                        <td>В наличии</td>
                        <td>В наличии</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy;kiyoushii Shop. Все права защищены.</p>
    </footer>

</body>
</html>
