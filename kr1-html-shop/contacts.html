<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP - Контакты</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <nav class="nav">
            <a class="nav__link" href="index.html">Главная</a>
            <a class="nav__link" href="catalog.html">Каталог</a>
            <a class="nav__link" href="about.html">О нас</a>
            <a class="nav__link" href="contacts.html">Контакты</a>
        </nav>
    </header>

    <main>
        <section class="contacts">
            <h1 class="contacts__title">Контакты</h1>
            <address class="contacts__address">
                Вы можете связаться с владельцем в
                <a href="https://t.me/kiyoushii">telegram</a>.<br />
                Если вы нашли какие-то баги, напишите на почту -
                <a href="mailto:andrew.abramenkov@mail.ru">andrew.abramenkov@mail.ru</a>.<br />
            </address>

            <form class="contact-form" action="..." method="post">
                <label for="name">Имя</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="message">Сообщение</label>
                <textarea id="message" name="message"></textarea>

                <button type="submit" class="contact-form__submit">Отправить</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy;kiyoushii Shop. Все права защищены.</p>
    </footer>

</body>
</html>
