<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP - Карточка товара</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <nav class="nav">
            <a class="nav__link" href="index.html">Главная</a>
            <a class="nav__link" href="catalog.html">Каталог</a>
            <a class="nav__link" href="about.html">О нас</a>
            <a class="nav__link" href="contacts.html">Контакты</a>
        </nav>
    </header>
    <main>

        <article class="product-detail-card">
            <img class="product-detail-card__img" src="img/mk_shop.jpg" alt="Мужская Куртка">
            <div class="product-detail-card__info">
                <h1>Мужская Куртка</h1>
                <p class="product-detail-card__description">Утепленная натуральным пухом и пером куртка из стеганой
                    ткани с защитой от влаги.</p>
                <p class="product-detail-card__price">Цена: 24900₽</p>
                <button class="product-detail-card__btn">В корзину</button>
            </div>
        </article>

        <section>
            <h2>Размеры и комплектация</h2>
            <table>
                <thead>
                    <tr>
                        <th scope="col">S</th>
                        <th scope="col">M</th>
                        <th scope="col">L</th>
                        <th scope="col">XL</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>В наличии</td>
                        <td>В наличии</td>
                        <td>Нет в наличии</td>
                        <td>В наличии</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy;kiyoushii Shop. Все права защищены.</p>
    </footer>

</body>
</html>
