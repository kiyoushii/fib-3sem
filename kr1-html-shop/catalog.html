<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP - Каталог</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <nav class="nav">
            <a class="nav__link" href="index.html">Главная</a>
            <a class="nav__link" href="catalog.html">Каталог</a>
            <a class="nav__link" href="about.html">О нас</a>
            <a class="nav__link" href="contacts.html">Контакты</a>
        </nav>
    </header>

    <main>
        <h1>Каталог товаров</h1>

        <section class="catalog">
            <article class="product-card">
                <div class="product-card__media">
                    <img class="product-card__img" src="img/newk.jpg" alt="Мужская Куртка">
                    <span class="product-card__badge">Новинка!</span>
                </div>
                <a href="product.html">
                    <h3 class="product-card__title">Мужская Куртка</h3>
                </a>
                <p class="product-card__price">24900₽</p>
                <button class="product-card__btn">В корзину</button>
            </article>
            <article class="product-card">
                <div class="product-card__media">
                    <img class="product-card__img" src="img/kep.jpg" alt="Кепка">
                    <span class="product-card__badge"></span>
                </div>
                <h3 class="product-card__title">Кепка</h3>
                <p class="product-card__price">4990₽</p>
                <button class="product-card__btn">В корзину</button>
            </article>
            <article class="product-card">
                <div class="product-card__media">
                    <img class="product-card__img" src="img/boti.jpg" alt="Ботинки">
                    <span class="product-card__badge"></span>
                </div>
                <h3 class="product-card__title">Ботинки</h3>
                <p class="product-card__price">10990₽</p>
                <button class="product-card__btn">В корзину</button>
            </article>
            <article class="product-card">
                <div class="product-card__media">
                    <img class="product-card__img" src="img/but.jpg" alt="Футболка">
                    <span class="product-card__badge"></span>
                </div>
                <h3 class="product-card__title">Футболка</h3>
                <p class="product-card__price">2890₽</p>
                <button class="product-card__btn">В корзину</button>
            </article>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy;kiyoushii Shop. Все права защищены.</p>
    </footer>

</body>
</html>
