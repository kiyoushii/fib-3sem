<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP - Каталог</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="about.html">О нас</a>
            <a href="contacts.html">Контакты</a>
        </nav>
    </header>

    <main>
        <h1>Каталог товаров</h1>
        <section class="catalog">
            <article class="product-card">
                <a href="product.html">
                 <h3 class="product-card__title">Мужская Куртка</h3>
                <img class="product-card__img" src="img/mk_shop.jpg" alt="Мужская Куртка">
                </a>
                <p class="product-card__price">2490₽</p>
                <button class="product-card__btn">В корзину</button>
            </article>

            <article class="product-card">
                <img class="product-card__img" src="img/placeholder.jpg" alt="Кепка">
                <h3 class="product-card__title">Кепка</h3>
                <p class="product-card__price">4990₽</p>
                <button class="product-card__btn">В корзину</button>
            </article>

            <article class="product-card">
                <img class="product-card__img" src="img/placeholder.jpg" alt="Ботинки мужские">
                <h3 class="product-card__title">Ботинки мужские</h3>
                <p class="product-card__price">10990₽</p>
                <button class="product-card__btn">В корзину</button>
            </article>

            <article class="product-card">
                <img class="product-card__img" src="img/placeholder.jpg" alt="Футболка">
                <h3 class="product-card__title">Футболка</h3>
                <p class="product-card__price">2890₽</p>
                <button class="product-card__btn">В корзину</button>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy;Shop. Все права защищены.</p>
    </footer>

</body>
</html>
