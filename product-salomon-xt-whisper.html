<!DOCTYPE html>

    <header class="header">
        <div class="header__inner">
            <a class="header__logo" href="index.html">KIYOUSHII</a>
            <nav class="nav">

                <a class="nav__link" href="catalog.html">Каталог</a>
                <a class="nav__link" href="about.html">О нас</a>
                <a class="nav__link" href="contacts.html">Контакты</a>
            </nav>
        </div>
    </header>

    <main>

        <article class="product-detail-card">
            <div class="product-detail-card__gallery">
                <img class="product-detail-card__img" src="images/09_3_obuv_salomon-xt-whisper_1.jpg" alt="Кроссовки Salomon XT Whisper">
                <div class="product-detail-card__thumbs">
                    <img class="product-detail-card__thumb" src="images/09_3_obuv_salomon-xt-whisper_2.jpg" alt="Кроссовки Salomon XT Whisper, вид 2">

            <div class="product-detail-card__info">
                <h1 class="product-detail-card__title">Кроссовки Salomon XT Whisper</h1>

                <p class="product-detail-card__price">Цена: 11900₽</p>

        <section class="sizes">
            <h2 class="sizes__title">Размеры и наличие</h2>
            <table class="sizes__table">
                <thead>
                    <tr>
                        <th scope="col">40</th>

                        <td>Нет в наличии</td>

    <footer class="footer">
        <p class="footer__text">&copy;kiyoushii Shop. Все права защищены.</p>
    </footer>
